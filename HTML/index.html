<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriApp</title>
</head>
<body>
    <button onclick="insertarDiv()">Push Here</button>
    <div id = "contenedor"></div>
</body>
<script>
    class Alimento{
    //Constructor
    constructor(id, horario, tipo, nombre, calorias, proteinas, carbohidratos, lipidos, precio, gramaje, descripcion){
        this._id = id;
        this._horario = horario;
        this._tipo = tipo;
        this._nombre = nombre;
        this._calorias = calorias;
        this._proteinas = proteinas;
        this._carbohidratos = carbohidratos;
        this._lipidos = lipidos;
        this._precio = precio;
        this._gramaje = gramaje;
        this._descripcion = descripcion;
    }

    //Getters
    get id(){return this._id;}
    get horario(){return this._horario;}
    get tipo(){return this._tipo;}
    get nombre(){return this._nombre;}
    get calorias(){return this._calorias;}
    get proteinas(){return this._proteinas;}
    get carbohidratos(){return this._carbohidratos;}
    get lipidos(){return this._lipidos;}
    get precio(){return this._precio;}
    get gramaje(){return this._gramaje;}
    get descripcion(){return this._descripcion;}

    //Setters
    set id(id){this._id = id;}
    set horario(horario){this._horario = horario;}
    set tipo(tipo){this._tipo = tipo;}
    set nombre(nombre){this._nombre = nombre;}
    set calorias(calorias){this._calorias = calorias;}
    set proteinas(proteinas){this._proteinas = proteinas;}
    set carbohidratos(carbohidratos){this._carbohidratos = carbohidratos;}
    set lipidos(lipidos){this._lipidos = lipidos;}
    set precio(precio){this._precio = precio;}
    set gramaje(gramaje){this._gramaje = gramaje;}
    set descripcion(descripcion){this._descripcion = descripcion;}

    //Métodos de clase
    descripcionNutricional(){
        return `\nCalorías: ${this._calorias}kcal    Proteínas: ${this._proteinas}g    Carbohidratos: ${this._carbohidratos}g    Lípidos: ${this._lipidos}g\n`;
    }

    multiplicarFactor(factor){
        this._calorias *= factor;
        this._proteinas *= factor;
        this._carbohidratos *= factor;
        this._lipidos *= factor;
        this._precio *= factor;
        this._gramaje *= factor;
    }
    
}


const { Pool } = require('pg');
// Crea una nueva instancia de Pool
const pool = new Pool({
  user: 'postgres',
  host: 'localhost',
  database: 'postgres',
  password: 'postgres',
  port: 5432
});

async function ejecutarQuery(query, params) {
    const result = await pool.query(query, params);
    const a = result.rows[0];
    return new Alimento(a.id, a.horario, a.tipo, a.nombre, a.calorias, a.proteinas, a.carbohidratos, a.lipidos, a.precio, a.gramaje, a.descripcion);
}

async function obtenerAlimento(horario) {
    const response = await fetch(`http://localhost:3000/api/alimento?horario=${horario}`);
    if (!response.ok) {
        throw new Error('Error al obtener el alimento');
    }
    return await response.json();
}



async function insertarDiv() {
    try {
        // Obtiene un alimento para el almuerzo
        let data = await obtenerAlimento('Almuerzo'); // Consulta para almuerzo
        let almuerzo = new Alimento(data.id, data.horario, data.tipo, data.nombre, data.calorias, data.proteinas, data.carbohidratos, data.lipidos, data.precio, data.gramaje, data.descripcion);
        
        // Obtiene un alimento para la cena
        let data2 = await obtenerAlimento('Cena'); // Consulta para cena
        let cena = new Alimento(data2.id, data2.horario, data2.tipo, data2.nombre, data2.calorias, data2.proteinas, data2.carbohidratos, data2.lipidos, data2.precio, data2.gramaje, data2.descripcion);
        
        // Muestra los alimentos en el contenedor
        document.getElementById("contenedor").innerHTML = `
            <h3>${almuerzo.horario}</h3>
            <h1>${almuerzo.nombre}</h1>
            <h2>Calorías: ${almuerzo.calorias} kcal, Proteínas: ${almuerzo.proteinas} g, Carbohidratos: ${almuerzo.carbohidratos} g, Lípidos: ${almuerzo.lipidos} g</h2>
            <br>
            <hr>
            <h3>${cena.horario}</h3>
            <h1>${cena.nombre}</h1>
            <h2>Calorías: ${cena.calorias} kcal, Proteínas: ${cena.proteinas} g, Carbohidratos: ${cena.carbohidratos} g, Lípidos: ${cena.lipidos} g</h2>
            <br>
            <hr>
        `;
    } catch (error) {
        console.error(error);
        document.getElementById("contenedor").innerHTML = `<h2>Error al obtener el alimento</h2>`;
    }
}


</script>
</html>
