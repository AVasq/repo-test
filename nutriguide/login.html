<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Login</title>
    <link rel="stylesheet" href="../css/estilos13.css"/>
</head>
<body>
    <div class="contenedor">
        <h2>Login</h2>
        <form id="forma" name="forma" method="post"> <!--Post porque tenemos informacion sensible, la contraseña.-->
            <div class="elemento"> <!--Agregamos un div por cada elemento que querramos capturar, para facilitar la tarea de estilizar con css.-->
                <label for="usuario">Usuario</label> <!--Al ser elementos dentro de un div, son bloques, por lo que no es necesario
                agregar una nueva linea, se agregan automaticamente en una nueva linea cuando se agregan nuevos elementos.-->
                <input type="text" id="usuario" name="usuario" required="true"/>
            </div>
            <div class="elemento">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required="true"/>
            </div>
            <div class="elemento">
                <input type="submit" id="boton" name="boton" value="Enviar"/>
            </div>
        </form>
    </div>
</body>
</html>
