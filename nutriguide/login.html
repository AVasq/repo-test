<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión – NutriGuide</title>
  <link rel="stylesheet" href="login.css"/>
  <link rel="stylesheet" href="estiloPopUp.css"/>
</head>
<body>
  <nav id="barraNav">
    <p id="logo"><img src="images/Salmon Lunch Plate Simple.png" alt="Logo NutriGuide"></p>
    <p id="enlaces">
      <a href="entrada.html">Inicio</a> |
      <a href="registroUsuarios.html">Registrarse</a> |
      <a href="contacto.html">Contacto</a>
    </p>
  </nav>

  <div class="contenedor-login">
    <form id="loginForm" autocomplete="off">
      <h2>Iniciar Sesión</h2>

      <label for="correo">Correo Electrónico</label><br/>
      <input type="email" id="correo" placeholder="tu@ejemplo.com" required/><br/><br/>

      <label for="password">Contraseña</label><br/>
      <input type="password" id="password" placeholder="••••••••" required/><br/><br/>

      <button type="submit">Entrar</button>
    </form>
  </div>

  <div id="overlay"></div>
  <div id="popup">
    <span class="cerrar" onclick="cerrarDivEmergente()">×</span>
    <p id="mensaje"></p>
  </div>


  <script src="clases.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
