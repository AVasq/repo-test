<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pacientes</title>
    <link rel="stylesheet" href="../css/estilos11.css"/>
</head>
<body>
    <h1>Registro de pacientes</h1>
    <div>
        <form id = "formulario" action="mi_servidor" autocomplete="off"><!--Si solo agregamos form, no se visualiza nada dentro del navegador-->
            <fieldset>
                <legend>Datos Personales: </legend>
                <label for="nombre">Nombre: </label></br>
                <input type="text" id="nombre" name="nombre" placeholder="Escriba el Nombre del Paciente" required="true"> <!--Los elementos de tipo input nos permiten capturar información sobre un usuario.-->
                </br>
                <label for="apellido">Apellido: </label></br>
                <input type="text" id="apellido" name="apellido" placeholder="Escriba el Apellido del Paciente" required="true"> <!--Los elementos de tipo input nos permiten capturar información sobre un usuario.-->
                </br>
                <label for="edad">Edad: </label><br>
                <input type="number" id="edad" name="edad" placeholder="Ingrese su Edad" required="true" min="18" max="65"><br>
                <label for="peso">Peso: </label><br>
                <input type="number" id="peso" name="peso" placeholder="Peso en Kilos" required="true" min="35" max="250"><br>
                <label for="altura">Altura: </label><br>
                <input type="number" id="altura" name="altura" placeholder="Altura en centímetros" required="true" min="121" max="250"><br>
                <br/>
                <label id="genero">Género:</label><br>
                <input type="radio" id="femenino" name="genero" value="2" required="true">
                <label for="femenino">Femenino </label>
                <br>
                <input type="radio" id="masculino" name="genero" value="1" required="true">
                <label for="masculino">Masculino </label>
                <br>
                </br>
                <label id="actividadFisica">Nivel de Actividad Física: </label><br>
                <input type="radio" id="sedentario" name="actividadFisica" value="1.2" required="true">
                <label for="sedentario">Sedentario </label>
                <input type="radio" id="pocoActivo" name="actividadFisica" value="1.375" required="true">
                <label for="pocoActivo">Poco Activo </label>
                <input type="radio" id="moderado" name="actividadFisica" value="1.55" required="true">
                <label for="moderado">Moderado </label>
                <input type="radio" id="activo" name="actividadFisica" value="1.725" required="true">
                <label for="activo">Activo </label>
                <input type="radio" id="muyActivo" name="actividadFisica" value="1.9" required="true">
                <label for="muyActivo">Muy Activo </label>
                <br/>
                <br/>
                <input type="submit" id="enviar" value="Enviar"> <!--El input tipo submit enviara la informacion capturada
                a un servidor.-->
                <input type="submit" id='novalido' formnovalidate="formnovalidate" value="Enviar sin Validar"/>
                <input type="reset" value="restablecer"/>
            </fieldset>
        </form>
    </div> 
</body>
</html>
