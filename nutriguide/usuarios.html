<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    <link rel="stylesheet" href="../css/estilos11.css"/>
</head>
<body>
    <h1>Registro de Usuarios</h1>
    <div>
        <form id = "formulario" action="mi_servidor" autocomplete="off">
            <fieldset>
                <legend>Datos Personales: </legend>
                <label for="nombre">Nombre: </label></br>
                <input type="text" id="nombre" name="nombre" placeholder="Escriba su Nombre" required="true"> 
                </br>
                <label for="apellido">Apellido: </label></br>
                <input type="text" id="apellido" name="apellido" placeholder="Escriba su Apellido" required="true"> 
                </br>
                <label for="rut">Rut: </label><br>
                <input type="text" id="rut" name="rut" placeholder="Ingrese su Rut" required="true"><br>
                <label for="correo">Correo Electrónico: </label><br>
                <input type="email" id="correo" name="correo" placeholder="Example@mail.com" required="true"><br>
                <label for="contraseña1">Contraseña: </label><br>
                <input type="password" id="contraseña1" name="contraseña1" placeholder="Escriba su Contraseña" required="true"><br>
                <label for="contraseña2">Contraseña: </label><br>
                <input type="password" id="contraseña2" name="contraseña2" placeholder="Repita la Contraseña" required="true"><br>
                
                <br/>
                <br/>
                <input type="submit" id="enviar" value="Enviar"> 
                <input type="submit" id='novalido' formnovalidate="formnovalidate" value="Enviar sin Validar"/>
                <input type="reset" value="restablecer"/>
            </fieldset>
        </form>
    </div>
    <button onclick="mostrarValores()">Presiona Acá</button> 
    <button onclick="pruebas()">Revisar validez de datos</button>
    <div id="divDatos"></div>
    <div id="prueba"></div>
    <script src="datosNutri.js"></script>
</body>
</html>
